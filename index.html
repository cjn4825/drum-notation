<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drum Practice</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="metronome-panel">
  <h4>Metronome</h4>
  <div class="metronome-controls">
    <label for="bpm-input">BPM</label>
    <input type="number" id="bpm-input" min="30" max="300" value="80">
    <button id="metronome-toggle">Start</button>
  </div>
  <label class="accent-label">
    <input type="checkbox" id="accent-checkbox">
    Accent beat 1
  </label>
  <div id="beat-indicator"></div>
</div>

<div class="page">
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="warmup">Warmup Routine</button>
    <button class="tab-btn" data-tab="sheetmusic">Sheet Music</button>
  </div>

  <div id="tab-warmup" class="tab-panel active">
    <h1>Daily Practice Routine</h1>

    <div class="warmup-file-controls">
      <button id="change-file-btn" class="reset-btn">Change Practice File</button>
      <select id="routine-select" class="file-select" style="display:none;"></select>
      <span id="routine-current-label"></span>
    </div>

    <textarea id="warmup-editor" spellcheck="false"></textarea>
    <div class="warmup-controls">
      <button id="warmup-save" class="reset-btn">Save</button>
      <button id="warmup-revert" class="reset-btn">Revert</button>
    </div>
    <p class="grid-hint" id="warmup-hint">
      Save writes straight to the file in <code>routines/</code> on disk. Revert re-loads that file, discarding
      unsaved changes. To add more practice files, just drop more .txt files into the <code>routines/</code> folder
      and use "Change Practice File" to pick them.
    </p>
  </div>

  <div id="tab-sheetmusic" class="tab-panel">
    <h1>Sheet Music</h1>
    <div class="warmup-file-controls">
      <label for="song-select">Song</label>
      <select id="song-select" class="file-select"></select>
    </div>
    <div id="song-warnings"></div>
    <div id="song-audio-status"></div>
    <div id="song-root"></div>
  </div>
</div>

<div id="player-bar" style="display:none;">
  <button id="player-play-toggle">&#9654;</button>
  <span id="player-time-current">0:00</span>
  <div id="player-progress-track">
    <div id="player-progress-fill"></div>
  </div>
  <span id="player-time-total">--:--</span>
  <label id="player-metronome-label">
    <input type="checkbox" id="player-metronome-toggle">
    Metronome
  </label>
</div>

<script src="js/alphaTab.min.js"></script>
<script src="js/routines.js"></script>
<script src="js/songs.js"></script>
<script src="js/metronome.js"></script>
<script src="js/sheetmusic-tab.js"></script>
<script src="js/main.js"></script>
</body>
</html>
